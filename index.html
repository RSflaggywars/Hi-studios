
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiDrop - File Upload</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    min-height: 100vh;
}

header {
    padding: 24px 8%;
    border-bottom: 1px solid #26314b;
    font-size: 25px;
    font-weight: bold;
}

header span {
    color: #7c5cff;
}

main {
    max-width: 750px;
    margin: 70px auto;
    padding: 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.subtitle {
    color: #a7b0c5;
    line-height: 1.6;
    margin-bottom: 35px;
}

.upload-box {
    background: #131c30;
    border: 2px dashed #455274;
    border-radius: 18px;
    padding: 55px 20px;
    text-align: center;
    transition: 0.2s;
}

.upload-box.dragover {
    border-color: #7c5cff;
    background: #201b40;
}

.upload-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.upload-box h2 {
    margin: 8px 0;
    font-size: 23px;
}

.upload-box p {
    color: #a7b0c5;
}

button, .browse {
    background: #7c5cff;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:hover, .browse:hover {
    background: #6746ee;
}

#fileInput {
    display: none;
}

.section-title {
    margin-top: 35px;
    margin-bottom: 15px;
    font-size: 18px;
}

.file-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: #131c30;
    border: 1px solid #26314b;
    border-radius: 12px;
    margin-bottom: 10px;
}

.file-icon {
    font-size: 27px;
}

.file-info {
    flex: 1;
    min-width: 0;
}

.file-name {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.file-size {
    color: #a7b0c5;
    font-size: 12px;
    margin-top: 6px;
}

.remove {
    background: #33202b;
    color: #ff8da1;
    padding: 9px 12px;
}

.remove:hover {
    background: #542332;
}

#empty {
    color: #77839c;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #77839c;
    padding: 25px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>Hi<span>Drop</span> 📁</header>

<main>
    <h1>Upload your files.</h1>

    <p class="subtitle">
        Simple, fast, and easy file selection.
        Choose files from your device or drag them into the box below.
    </p>

    <div class="upload-box" id="dropZone">
        <div class="upload-icon">☁️</div>
        <h2>Drop your files here</h2>
        <p>or click below to browse your device</p>

        <button type="button" id="browseButton">
            Choose files
        </button>

        <input type="file" id="fileInput" multiple>
    </div>

    <h2 class="section-title">Selected files</h2>

    <div id="fileList">
        <p id="empty">No files selected yet.</p>
    </div>
</main>

<footer>
    HiDrop &copy; 2026 · Demo file uploader
</footer>

<script>
const input = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const browseButton = document.getElementById("browseButton");
const fileList = document.getElementById("fileList");

let selectedFiles = [];

browseButton.addEventListener("click", () => input.click());

input.addEventListener("change", () => {
    addFiles(input.files);
    input.value = "";
});

dropZone.addEventListener("dragover", event => {
    event.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", event => {
    event.preventDefault();
    dropZone.classList.remove("dragover");
    addFiles(event.dataTransfer.files);
});

function addFiles(files) {
    selectedFiles.push(...Array.from(files));
    renderFiles();
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function renderFiles() {
    fileList.innerHTML = "";

    if (selectedFiles.length === 0) {
        fileList.innerHTML =
            '<p id="empty">No files selected yet.</p>';
        return;
    }

    selectedFiles.forEach((file, index) => {
        const item = document.createElement("div");
        item.className = "file-item";

        const icon = document.createElement("div");
        icon.className = "file-icon";
        icon.textContent = "📄";

        const info = document.createElement("div");
        info.className = "file-info";

        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.name;

        const size = document.createElement("div");
        size.className = "file-size";
        size.textContent = formatSize(file.size);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
            selectedFiles.splice(index, 1);
            renderFiles();
        });

        info.append(name, size);
        item.append(icon, info, remove);
        fileList.appendChild(item);
    });
}
</script>

</body>
</html>
