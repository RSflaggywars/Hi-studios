
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra AI Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    font-family: Arial, sans-serif;
    background: #0c0d10;
    color: #f5f5f7;
}

.sidebar {
    width: 250px;
    flex-shrink: 0;
    background: #101115;
    border-right: 1px solid #292a32;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span {
    color: #a99aff;
}

.new-chat {
    background: #24242e;
    color: white;
    border: 1px solid #393946;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #333340;
}

.model {
    margin-top: auto;
    color: #a5a5b5;
    font-size: 12px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

header {
    height: 66px;
    flex-shrink: 0;
    padding: 0 25px;
    border-bottom: 1px solid #292a32;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.status {
    font-size: 12px;
    color: #a5a5b5;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 18px;
}

.welcome {
    text-align: center;
    margin: 13vh auto 35px;
    max-width: 500px;
}

.symbol {
    color: #b3a6ff;
    font-size: 40px;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: clamp(27px, 4vw, 38px);
    letter-spacing: -1.5px;
    margin-bottom: 12px;
}

.welcome p {
    color: #9293a3;
    line-height: 1.6;
}

.message {
    max-width: 760px;
    margin: 0 auto 25px;
    display: flex;
    gap: 13px;
    align-items: flex-start;
}

.avatar {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: #282638;
    font-size: 12px;
}

.message.user .avatar {
    background: #393047;
}

.content {
    min-width: 0;
    padding-top: 5px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.content.error {
    color: #ff9c9c;
}

.composer-area {
    padding: 12px 18px 20px;
}

.composer {
    max-width: 760px;
    margin: auto;
    border: 1px solid #393945;
    background: #17181e;
    border-radius: 16px;
    padding: 10px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    padding: 7px;
    max-height: 180px;
}

textarea::placeholder {
    color: #777888;
}

#send {
    background: #a99aff;
    color: #171321;
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
}

#send:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.hint {
    text-align: center;
    color: #696a78;
    font-size: 11px;
    margin-top: 10px;
}

@media (max-width: 600px) {
    .sidebar {
        display: none;
    }

    header {
        padding: 0 16px;
    }

    #chat {
        padding: 20px 14px;
    }

    .composer-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">astra<span>.</span></div>

    <button class="new-chat" id="newChat">
        ＋ New chat
    </button>

    <div class="model">
        <strong>MODEL</strong><br>
        ollama/gpt-6-astra<br>
        <span>LiteLLM connection</span><br><br>
        <strong>SERVER</strong><br>
        0.0.0.0:4000/v1/chat
    </div>
</aside>

<main class="main">

    <header>
        <strong>Astra AI</strong>
        <span class="status" id="status">Ready</span>
    </header>

    <section id="chat">
        <div class="welcome" id="welcome">
            <div class="symbol">✳</div>
            <h1>What are we building?</h1>
            <p>Your AI coding assistant, connected to your LiteLLM server.</p>
        </div>
    </section>

    <div class="composer-area">
        <form class="composer" id="form">
            <textarea
                id="input"
                rows="1"
                placeholder="Message Astra..."
                aria-label="Message Astra"
            ></textarea>

            <button id="send" type="submit" aria-label="Send">
                ↑
            </button>
        </form>

        <div class="hint">
            Enter to send · Shift + Enter for a new line
        </div>
    </div>

</main>

<script>
const API_URL = "http://0.0.0.0:4000/v1/chat";
const MODEL = "ollama/gpt-6-astra";

// Add your LiteLLM API key if required.
const API_KEY = "";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusText = document.getElementById("status");

let messages = [];
let busy = false;

function addMessage(role, text, isError = false) {
    const row = document.createElement("div");
    row.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "✳";

    const content = document.createElement("div");
    content.className = "content";

    if (isError) {
        content.classList.add("error");
    }

    // textContent prevents AI responses from injecting HTML.
    content.textContent = text;

    row.appendChild(avatar);
    row.appendChild(content);
    chat.appendChild(row);

    chat.scrollTop = chat.scrollHeight;

    return content;
}

function resetChat() {
    if (busy) return;

    messages = [];
    chat.replaceChildren();

    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const symbol = document.createElement("div");
    symbol.className = "symbol";
    symbol.textContent = "✳";

    const title = document.createElement("h1");
    title.textContent = "What are we building?";

    const description = document.createElement("p");
    description.textContent =
        "Your AI coding assistant, connected to your LiteLLM server.";

    welcome.append(symbol, title, description);
    chat.appendChild(welcome);

    statusText.textContent = "Ready";
}

async function sendMessage(text) {
    if (!text.trim() || busy) return;

    busy = true;
    send.disabled = true;
    input.disabled = true;
    statusText.textContent = "Thinking...";

    const userMessage = {
        role: "user",
        content: text.trim()
    };

    messages.push(userMessage);
    addMessage("user", userMessage.content);

    const thinking = addMessage("assistant", "Thinking...");

    try {
        const headers = {
            "Content-Type": "application/json"
        };

        if (API_KEY) {
            headers["Authorization"] = "Bearer " + API_KEY;
        }

        const response = await fetch(API_URL, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                stream: false
            })
        });

        if (!response.ok) {
            const detail = await response.text();

            throw new Error(
                "HTTP " + response.status + ": " + detail
            );
        }

        const data = await response.json();
        const answer = data.choices?.[0]?.message?.content;

        if (typeof answer !== "string") {
            throw new Error(
                "The server returned no text response. Check its API format."
            );
        }

        thinking.textContent = answer;

        messages.push({
            role: "assistant",
            content: answer
        });

        statusText.textContent = "Ready";

    } catch (error) {
        thinking.classList.add("error");

        thinking.textContent =
            "Connection failed.\n\n" +
            error.message +
            "\n\nCheck the server URL, model name, API key, and CORS settings.";

        // Remove the unsuccessful user request from the history.
        messages.pop();

        statusText.textContent = "Connection error";

    } finally {
        busy = false;
        send.disabled = false;
        input.disabled = false;
        input.focus();

        chat.scrollTop = chat.scrollHeight;
    }
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (busy || !input.value.trim()) return;

    const text = input.value;

    input.value = "";
    input.style.height = "auto";

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    sendMessage(text);
});

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
    }
});

input.addEventListener("input", function() {
    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight, 180) + "px";
});

document.getElementById("newChat").addEventListener(
    "click",
    resetChat
);
</script>

</body>
</html>
