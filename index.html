<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Direct Connect</title>
    <!-- We import PeerJS to handle the complex WebRTC connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #eef2f3; display: flex; justify-content: center; padding:
20px; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 100%; max-width: 500px; }
        .status { padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 0.9rem; font-weight: bold;
text-align: center; }
        .online { background: #d4edda; color: #155724; }
        .offline { background: #f8d7da; color: #721c24; }

        .section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        input { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ccc;
border-radius: 5px; }
        button { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 5px; background:
#007bff; color: white; font-weight: bold; }
        button:hover { background: #0056b3; }

        #chat-box { height: 200px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px;
background: #fafafa; display: flex; flex-direction: column; }
        .msg { margin-bottom: 8px; padding: 5px 10px; border-radius: 5px; max-width: 80%; }
        .msg.me { background: #007bff; color: white; align-self: flex-end; }
        .msg.them { background: #e2e2e2; color: black; align-self: flex-start; }
    </style>
</head>
<body>

<div class="card">
    <h2>P2P Direct Connect</h2>

    <div id="status" class="status offline">Initializing...</div>

    <!-- Section 1: Your ID -->
    <div class="section">
        <p><strong>Your Peer ID:</strong> <span id="my-id" style="color: #007bff;">...</span></p>
        <small>Share this ID with your friend so they can connect to you.</small>
    </div>

    <!-- Section 2: Connect to Peer -->
    <div class="section">
        <input type="text" id="peer-id-input" placeholder="Enter Friend's Peer ID">
        <button onclick="connectToPeer()">Connect to Peer</button>
    </div>

    <!-- Section 3: Messaging -->
    <div class="section">
        <div id="chat-box"></div>
        <input type="text" id="message-input" placeholder="Type a message...">
        <button onclick="sendMessage()" style="background: #28a745;">Send Message</button>
    </div>
</div>

<script>
    let peer;
    let conn;

    // 1. Create a Peer object. This generates a random ID for you.
    peer = new Peer();

    // When the Peer ID is generated and ready
    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
        document.getElementById('status').innerText = "Ready for Connection";
        document.getElementById('status').className = "status online";
    });

    // 2. Listen for incoming connections from other peers
    peer.on('connection', (connection) => {
        conn = connection;
        setupChat();
        appendMessage("System", "Friend connected to you!", "them");
    });

    // 3. Function to connect to someone else
    function connectToPeer() {
        const peerId = document.getElementById('peer-id-input').value;
        if (!peerId) return alert("Please enter an ID");

        conn = peer.connect(peerId);
        setupChat();
        appendMessage("System", "Connecting to peer...", "them");
    }

    // 4. Handle data transmission
    function setupChat() {
        conn.on('open', () => {
            document.getElementById('status').innerText = "Connected P2P!";
            document.getElementById('status').className = "status online";

            conn.on('data', (data) => {
                appendMessage("Friend", data, "them");
            });
        });

        conn.on('close', () => {
            document.getElementById('status').innerText = "Connection Closed";
            document.getElementById('status').className = "status offline";
        });
    }

    function sendMessage() {
        const msgInput = document.getElementById('message-input');
        const msg = msgInput.value;

        if (conn && conn.open) {
            conn.send(msg); // Sends data directly to the other browser
            appendMessage("Me", msg, "me");
            msgInput.value = "";
        } else {
            alert("Not connected to anyone!");
        }
    }

    function appendMessage(sender, text, type) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = `${sender}: ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
