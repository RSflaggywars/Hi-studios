<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Provider API Key Generator</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4f46e5;
        }

        .result-area {
            margin-top: 2rem;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.5rem;
            border: 1px dashed var(--primary);
            display: none;
            position: relative;
        }

        .key-display {
            font-family: 'Courier New', Courier, monospace;
            word-break: break-all;
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .copy-btn {
            margin-top: 10px;
            background: #334155;
            font-size: 0.8rem;
            width: auto;
            padding: 5px 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔑 AI Key Mixer</h1>

        <div class="form-group">
            <label for="provider">Select AI Provider</label>
            <select id="provider">
                <option value="openai">OpenAI (sk-...)</option>
                <option value="anthropic">Anthropic (ak-...)</option>
                <option value="google">Google Gemini (AIza...)</option>
                <option value="mistral">Mistral (mi-...)</option>
                <option value="custom">Custom Mixed Format</option>
            </select>
        </div>

        <button onclick="generateKey()">Generate API Key</button>

        <div id="resultArea" class="result-area">
            <div id="keyDisplay" class="key-display"></div>
            <button class="copy-btn" onclick="copyKey()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateKey() {
            const provider = document.getElementById('provider').value;
            const display = document.getElementById('keyDisplay');
            const area = document.getElementById('resultArea');
            let finalKey = "";

            switch(provider) {
                case 'openai':
                    finalKey = "sk-" + generateRandomString(48);
                    break;
                case 'anthropic':
                    finalKey = "ak-ant-" + generateRandomString(32);
                    break;
                case 'google':
                    finalKey = "AIza" + generateRandomString(36);
                    break;
                case 'mistral':
                    finalKey = "mi-" + generateRandomString(40);
                    break;
                case 'custom':
                    finalKey = "MIX-" + generateRandomString(10) + "-" + generateRandomString(10) + "-" +
generateRandomString(10);
                    break;
            }

            display.innerText = finalKey;
            area.style.display = 'block';
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(key);
            alert("Key copied to clipboard!");
        }
    </script>
</body>
</html>
