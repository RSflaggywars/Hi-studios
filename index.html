
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen AI Chat</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101114;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 20px;
    background: #191a20;
    border-bottom: 1px solid #30313a;
}

header h2 { margin: 0; color: #a5b4fc; }
header p { color: #9ca3af; margin-bottom: 0; }

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    width: 100%;
    max-width: 850px;
    margin: auto;
}

.message {
    padding: 14px;
    margin: 12px 0;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

.user { background: #303447; }
.ai { background: #1e2028; }

footer {
    padding: 20px;
    background: #191a20;
}

form {
    display: flex;
    gap: 10px;
    max-width: 850px;
    margin: auto;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #393b46;
    background: #252630;
    color: white;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 0 22px;
    background: #6366f1;
    color: white;
    cursor: pointer;
}

button:disabled { opacity: .5; }

#status {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    margin-top: 10px;
}
</style>
</head>

<body>
<header>
    <h2>✦ Qwen AI</h2>
    <p>Powered by Ollama + LiteLLM</p>
</header>

<main id="chat">
    <div class="message ai">
        Hello! I'm Qwen. What would you like to ask?
    </div>
</main>

<footer>
    <form id="form">
        <input id="input" placeholder="Message Qwen..." autocomplete="off">
        <button id="send" type="submit">Send</button>
    </form>
    <div id="status">API: localhost:4000</div>
</footer>

<script>
const API = "http://localhost:4000/v1/chat/completions";
const MODEL = "ollama_chat/qwen2.5:1.5b";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

const messages = [
    {
        role: "system",
        content: "You are a helpful AI assistant. Answer clearly."
    }
];

function addMessage(role, text) {
    const element = document.createElement("div");
    element.className = "message " + role;
    element.textContent = text;
    chat.appendChild(element);
    chat.scrollTop = chat.scrollHeight;
    return element;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || send.disabled) return;

    input.value = "";
    addMessage("user", text);
    messages.push({ role: "user", content: text });

    send.disabled = true;
    input.disabled = true;
    status.textContent = "Qwen is thinking...";

    const replyElement = addMessage("ai", "Thinking...");

    try {
        const response = await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                stream: false
            })
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status + ": " +
                await response.text()
            );
        }

        const data = await response.json();
        const reply = data.choices[0].message.content;

        replyElement.textContent = reply;
        messages.push({ role: "assistant", content: reply });
        status.textContent = "Connected to Qwen";

    } catch (error) {
        replyElement.textContent =
            "Error: " + error.message +
            "\nCheck LiteLLM and your browser's CORS settings.";
        status.textContent = "Connection failed";
    } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
});
</script>
</body>
</html>
